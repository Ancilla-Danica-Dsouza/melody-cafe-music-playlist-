[project]
name = "melody-cafe-music-player"
version = "1.2.0"
description = "Music player built on a doubly circular linked list (Python + tkinter)"
authors = [{ name = "Ancilla Danica Dsouza" }]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.optional-dependencies]
audio = ["pygame>=2.5"]

[project.scripts]
melody-cafe = "melody_cafe.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["melody_cafe*"]
